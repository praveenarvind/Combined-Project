name: Julia final-study validation (RSP 1 through 5)
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.8.5'
      - run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test(; julia_args=["--threads=4"])'
      - run: julia --startup-file=no --project=. scripts/baseline.jl --smoke
      - run: julia --startup-file=no --project=. test/score_output.jl
      - name: Complete synthetic runner fixture, not original-scenario results
        run: julia --startup-file=no --project=. scripts/phase5.jl --fixture --inventory --batch --summarize --max-jobs=80 --max-seconds=600 --output=results/phase5-ci
      - run: julia --startup-file=no --project=. test/phase5_output.jl
      - name: Completed fixture replay must perform no new planning
        run: julia --startup-file=no --project=. scripts/phase5.jl --fixture --batch --max-jobs=1 --output=results/phase5-ci
      - name: Freeze the full original-scenario inventory without executing it
        run: julia --startup-file=no --project=. scripts/phase5.jl --inventory --output=results/phase5-inventory
      - uses: actions/upload-artifact@v4
        with:
          name: phase5-functional-fixture-and-inventory
          path: |
            results/phase5-ci/
            results/phase5-inventory/
