name: Julia filming, joint SRPPA and threaded RSP
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.8.5'
      - run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test(; julia_args=["--threads=4"])'
      - run: julia --startup-file=no --project=. scripts/baseline.jl --smoke
      - run: julia --startup-file=no --project=. test/score_output.jl
      - run: julia --startup-file=no --project=. scripts/rsp_pilot.jl --ci
      - run: julia --startup-file=no --project=. test/pilot_output.jl
      - uses: actions/upload-artifact@v4
        with:
          name: rsp-ci-pilot
          path: results/rsp-ci/
