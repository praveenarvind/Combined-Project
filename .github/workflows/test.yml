name: Julia filming and controlled RSP benchmarks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.8.5'
      - run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test(; julia_args=["--threads=4"])'
      - run: julia --startup-file=no --project=. scripts/baseline.jl --smoke
      - run: julia --startup-file=no --project=. test/score_output.jl
      - run: julia --startup-file=no --project=. scripts/rsp_pilot.jl --ci
      - run: julia --startup-file=no --project=. test/pilot_output.jl
      - uses: actions/upload-artifact@v4
        with:
          name: rsp-ci-pilot
          path: results/rsp-ci/
      - run: julia --startup-file=no --project=. scripts/benchmark.jl --config=configs/benchmarks/ci.toml --run --output=results/benchmark-ci
      - run: julia --startup-file=no --project=. test/benchmark_output.jl
      - run: julia --threads=1 --startup-file=no --project=. scripts/benchmark.jl --config=configs/benchmarks/ci-one-thread.toml --run --output=results/benchmark-ci-one-thread
      - run: julia --startup-file=no --project=. test/benchmark_pair_output.jl results/benchmark-ci/run.json results/benchmark-ci-one-thread/run.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-functional-ci
          path: |
            results/benchmark-ci/
            results/benchmark-ci-one-thread/
